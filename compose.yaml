name: test-catalog

x-app: &app
  build: ./backend
  image: test-catalog-backend
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &environment
    PGHOST: db
    PGDATABASE: catalog
    PGUSER: catalog
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    S3_ENDPOINT: minio:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    S3_BUCKET: ${S3_BUCKET:-products}
  depends_on:
    setup:
      condition: service_completed_successfully
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 3

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: catalog
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U catalog -d catalog]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    build: ./minio
    image: test-catalog-minio
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 10

  setup:
    <<: *app
    restart: "no"
    command: [python, manage.py, setup]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  api:
    <<: *app

  bot:
    <<: *app
    profiles: [telegram]
    command: [uvicorn, bot:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    environment:
      <<: *environment
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_IDS: ${ADMIN_IDS:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}

  web:
    build: ./frontend
    image: test-catalog-web
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${PORT:-8080}:8080"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [web]

volumes:
  postgres-data:
  minio-data:
