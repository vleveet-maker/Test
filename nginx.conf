events {}
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream api { zone api 64k; server api:8000 resolve; }
    upstream web { zone web 64k; server web:3000 resolve; }
    upstream bot { zone bot 64k; server bot:8000 resolve; }
    server {
        listen 8080;
        client_max_body_size 64k;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Content-Type-Options nosniff always;
        location /api/ { proxy_pass http://api; }
        location = /telegram/webhook { proxy_pass http://bot; }
        location / { proxy_pass http://web; }
    }
}
